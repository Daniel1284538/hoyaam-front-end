<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد التقاضي — Litigation Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ==========================================================================
   Design tokens — matches the firm's approved template (hoyaam design
   system) exactly: same custom properties, same fonts, same component
   class names, so this file and the template stay visually interchangeable.
   ========================================================================== */
:root {
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --inset: #EAECF0;
  --border: #DCE0E6;
  --text: #2A1B5E;
  --text-2: #B0206E;
  --text-dim: #8C6BAE;
  --accent: #FD6262;
  --good: #16A34A;
  --warn: #D9720A;
  --danger: #C3272C;
  --gold: #9C7A3C;
  --font-ui: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-doc: 'Amiri', serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(42, 27, 94, 0.05);
  --shadow-md: 0 4px 12px rgba(42, 27, 94, 0.08);
}
[data-theme="dark"] {
  --bg: #10131A; --card: #171B23; --inset: #0C0F14; --border: #262D39;
  --text: #E8EAED; --text-2: #8B94A3; --text-dim: #4E5768;
  --accent: #FD6262; --good: #22C55E; --warn: #F5A623; --danger: #E5484D; --gold: #C9A66B;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4); --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  font-family: var(--font-ui); background-color: var(--bg); color: var(--text);
  line-height: 1.6; direction: rtl; text-align: start; -webkit-font-smoothing: antialiased;
}
bdi, .mono-data { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; display: inline-block; }
.doc-heading, h1, h2, h3 { font-family: var(--font-doc); letter-spacing: -0.01em; }
a { color: var(--text-2); }

/* App shell */
.app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
.sidebar {
  width: 260px; min-width: 260px; background: var(--card);
  border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; height: 100%;
}
.sidebar-header { padding-block: 20px; padding-inline: 18px; border-block-end: 1px solid var(--border); }
.firm-brand { display: flex; align-items: center; gap: 12px; overflow: hidden; }
.firm-logo {
  width: 38px; height: 38px; border-radius: var(--radius-md); background: var(--text); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-doc);
  font-size: 20px; flex-shrink: 0; border: 1px solid var(--gold);
}
.firm-title { font-family: var(--font-doc); font-size: 17px; font-weight: 700; color: var(--text); white-space: nowrap; line-height: 1.2; }
.firm-subtitle { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.nav-links { list-style: none; padding-block: 14px; padding-inline: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav-item button {
  width: 100%; display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-inline: 14px;
  border-radius: var(--radius-md); border: 1px solid transparent; background: transparent; color: var(--text-2);
  font-family: var(--font-ui); font-size: 14px; font-weight: 500; cursor: pointer; text-align: start; transition: all .15s ease;
}
.nav-item button:hover { background: var(--inset); color: var(--text); }
.nav-item.active button { background: var(--inset); color: var(--text); border-color: var(--border); font-weight: 600; }
.nav-item.active button .nav-icon { color: var(--accent); }
.nav-icon { width: 20px; height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--text-dim); }
.nav-badge {
  margin-inline-start: auto; padding-block: 2px; padding-inline: 8px; border-radius: 12px; font-size: 11px;
  font-family: var(--font-mono); font-weight: 600; background: var(--inset); color: var(--text-dim); border: 1px solid var(--border);
}
.nav-badge.danger { background: rgba(195,39,44,.12); color: var(--danger); border-color: rgba(195,39,44,.25); }
.sidebar-footer { padding-block: 14px; padding-inline: 14px; border-block-start: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lawyer-profile { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--inset); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: var(--text); flex-shrink: 0; }
.lawyer-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
.lawyer-role { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

.main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--bg); }
.top-bar { height: 60px; min-height: 60px; background: var(--card); border-block-end: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding-inline: 24px; gap: 16px; }
.top-bar-start { display: flex; align-items: center; gap: 16px; flex: 1; max-width: 480px; }
.top-bar-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s ease; }
.icon-btn:hover { background: var(--inset); }

.page-container { flex: 1; overflow-y: auto; padding-block: 24px; padding-inline: 28px; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-block-end: 24px; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 12px; }
.page-subtitle { font-size: 13px; color: var(--text-dim); font-weight: 400; font-family: var(--font-ui); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding-block: 8px; padding-inline: 16px; border-radius: var(--radius-md); font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; white-space: nowrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--text); color: var(--card); border-color: var(--text); }
.btn-primary:hover { opacity: .92; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-outline { background: var(--card); color: var(--text); border-color: var(--border); }
.btn-outline:hover { background: var(--inset); }
.btn-sm { padding-block: 4px; padding-inline: 10px; font-size: 12px; }
.btn-good { background: rgba(22,163,74,.1); color: var(--good); border-color: rgba(22,163,74,.3); }
.btn-good:hover { background: var(--good); color: #fff; }
.btn-warn { background: rgba(217,114,10,.1); color: var(--warn); border-color: rgba(217,114,10,.3); }
.btn-warn:hover { background: var(--warn); color: #fff; }
.btn-danger { background: rgba(195,39,44,.1); color: var(--danger); border-color: rgba(195,39,44,.3); }
.btn-danger:hover { background: var(--danger); color: #fff; }

/* Cards / panels */
.dash-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 20px; padding-inline: 22px; display: flex; flex-direction: column; gap: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; border-block-end: 1px solid var(--border); padding-block-end: 12px; gap: 12px; flex-wrap: wrap; }
.panel-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.panel-count { font-size: 12px; font-family: var(--font-mono); color: var(--text-dim); background: var(--inset); padding-block: 2px; padding-inline: 8px; border-radius: 10px; }

/* Deadlines */
.deadline-row { display: flex; align-items: center; justify-content: space-between; padding-block: 12px; padding-inline: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); gap: 12px; }
.deadline-row.overdue { border-inline-start: 4px solid var(--danger); }
.deadline-row.this-week { border-inline-start: 4px solid var(--warn); }
.deadline-row.upcoming { border-inline-start: 4px solid var(--good); }
.deadline-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.deadline-title { font-size: 14px; font-weight: 600; color: var(--text); }
.deadline-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.citation-tag { font-family: var(--font-mono); font-size: 11px; background: var(--inset); color: var(--text-2); padding-block: 2px; padding-inline: 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding-block: 3px; padding-inline: 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip-confirmed { background: rgba(22,163,74,.12); color: var(--good); border: 1px solid rgba(22,163,74,.35); }
.chip-provisional { background: rgba(217,114,10,.12); color: var(--warn); border: 1px dashed rgba(217,114,10,.6); animation: pulse-soft 2s infinite ease-in-out; }
@keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .75; } }
.chip-stage { background: var(--inset); color: var(--text-2); border: 1px solid var(--border); font-size: 11px; }
.chip-danger { background: rgba(195,39,44,.12); color: var(--danger); border: 1px solid rgba(195,39,44,.35); }

/* Tables */
.table-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.filter-bar { padding-block: 14px; padding-inline: 18px; background: var(--card); border-block-end: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-input { height: 36px; padding-inline: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--inset); color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; flex: 1; min-width: 200px; }
.filter-input:focus { border-color: var(--text); background: var(--card); }
.table-wrapper { overflow-x: auto; width: 100%; }
.dense-table { width: 100%; border-collapse: collapse; text-align: start; }
.dense-table th { background: var(--inset); color: var(--text-2); font-size: 12px; font-weight: 600; padding-block: 10px; padding-inline: 14px; border-block-end: 1px solid var(--border); white-space: nowrap; }
.dense-table td { padding-block: 12px; padding-inline: 14px; font-size: 13px; color: var(--text); border-block-end: 1px solid var(--border); }
.dense-table tbody tr { cursor: pointer; transition: background .1s ease; }
.dense-table tbody tr:hover { background: var(--inset); }
.dense-table td.cell-matter-num { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
.empty-note { color: var(--text-dim); font-size: 14px; padding: 18px; }

/* Matter detail */
.matter-header-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 22px; padding-inline: 26px; margin-block-end: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; }
.matter-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.matter-headline { font-family: var(--font-doc); font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.3; }
.matter-meta-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
.meta-item { display: inline-flex; align-items: center; gap: 6px; }
.tabs-nav { display: flex; align-items: center; gap: 4px; border-block-end: 1px solid var(--border); margin-block-end: 20px; overflow-x: auto; }
.tab-btn { padding-block: 10px; padding-inline: 18px; border: none; background: transparent; color: var(--text-2); font-family: var(--font-ui); font-size: 14px; font-weight: 500; cursor: pointer; border-block-end: 2px solid transparent; transition: all .15s ease; white-space: nowrap; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-block-end-color: var(--accent); font-weight: 600; }

/* Upload */
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding-block: 40px; padding-inline: 28px; text-align: center; background: var(--card); cursor: pointer; transition: border-color .15s ease, background .15s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--inset); }
.upload-icon { width: 42px; height: 42px; color: var(--accent); }
.upload-title { font-size: 16px; font-weight: 600; color: var(--text); }
.upload-desc { font-size: 12.5px; color: var(--text-dim); max-width: 440px; }
.file-progress-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding-block: 16px; padding-inline: 20px; display: flex; flex-direction: column; gap: 12px; }
.file-info-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.filename { font-weight: 600; font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.file-stepper { display: flex; align-items: center; justify-content: space-between; position: relative; padding-block: 8px; }
.file-step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; position: relative; z-index: 2; }
.step-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--inset); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-dim); }
.file-step.completed .step-dot { background: var(--good); border-color: var(--good); color: #fff; }
.file-step.current .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 3px rgba(253,98,98,.2); }
.file-step.failed .step-dot { background: var(--danger); border-color: var(--danger); color: #fff; }
.step-name { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
.file-step.completed .step-name, .file-step.current .step-name, .file-step.failed .step-name { color: var(--text); font-weight: 600; }

/* Review split view */
.split-review-container { display: grid; grid-template-columns: 1fr 1.05fr; gap: 20px; height: calc(100vh - 210px); min-height: 420px; }
@media (max-width: 900px) { .split-review-container { grid-template-columns: 1fr; height: auto; } }
.doc-viewer-pane, .extractions-pane { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; }
.doc-viewer-header, .extractions-header { padding-block: 12px; padding-inline: 16px; border-block-end: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--inset); gap: 10px; }
.doc-canvas-area { flex: 1; background: #20242D; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 16px; }
.doc-canvas-area iframe, .doc-canvas-area img { width: 100%; height: 100%; border: none; background: #fff; border-radius: 4px; object-fit: contain; }
.doc-page-text { flex: 1; overflow-y: auto; padding: 20px; font-family: var(--font-doc); font-size: 15px; line-height: 1.9; color: var(--text); background: var(--card); white-space: pre-wrap; }
.extractions-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.extraction-row { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
.extraction-row.confirmed, .extraction-row.corrected { border-inline-start: 4px solid var(--good); }
.extraction-row.rejected { border-inline-start: 4px solid var(--danger); opacity: .65; }
.ext-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.ext-field-name { font-weight: 600; font-size: 13px; color: var(--text); }
.confidence-chip { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding-block: 2px; padding-inline: 8px; border-radius: 10px; }
.confidence-high { background: rgba(22,163,74,.15); color: var(--good); }
.confidence-mid { background: rgba(217,114,10,.15); color: var(--warn); }
.confidence-low { background: rgba(195,39,44,.15); color: var(--danger); }
.ext-value-input { width: 100%; padding-block: 8px; padding-inline: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: var(--font-ui); font-size: 13px; font-weight: 500; outline: none; }
.ext-value-input:focus { border-color: var(--text); }
.ext-actions-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.review-footer { padding-block: 14px; padding-inline: 18px; border-block-start: 1px solid var(--border); background: var(--inset); display: flex; align-items: center; justify-content: space-between; gap: 16px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 18px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 600; color: var(--text); }
.form-input, .form-textarea, .form-select {
  padding-block: 8px; padding-inline: 12px; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--inset); color: var(--text); font-family: var(--font-ui); font-size: 13px; outline: none; width: 100%;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--text); background: var(--card); }
.form-hint { font-size: 11px; color: var(--text-dim); }
.form-error { font-size: 12px; color: var(--danger); background: rgba(195,39,44,.08); border: 1px solid rgba(195,39,44,.25); border-radius: var(--radius-sm); padding: 8px 12px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .form-row-2 { grid-template-columns: 1fr; } }

/* Toast */
.app-toast { position: fixed; bottom: 24px; inset-inline-start: 24px; background: var(--text); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 999; display: flex; align-items: center; gap: 10px; font-size: 13px; animation: toast-in .3s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Auth screens (not in the reference template — same tokens/fonts, own layout) */
.auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.auth-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-block-end: 4px; }

/* Chronology timeline */
.chronology-tree { display: flex; flex-direction: column; gap: 18px; }
.chron-entry { display: flex; gap: 18px; padding-inline-start: 16px; border-inline-start: 2px solid var(--border); position: relative; padding-bottom: 4px; }
.chron-entry::before { content: ''; position: absolute; inset-inline-start: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.chron-date { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text-2); min-width: 95px; }
.chron-desc { font-size: 14px; color: var(--text); flex: 1; }
.chron-ref-chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; background: var(--inset); color: var(--text-2); padding-block: 2px; padding-inline: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-block-start: 6px; }

/* Archive search / research */
.search-hero-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; margin-block-end: 20px; display: flex; flex-direction: column; gap: 14px; }
.search-results-list { display: flex; flex-direction: column; gap: 14px; }
.search-result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.search-result-title { font-size: 14px; font-weight: 700; color: var(--text); }
.search-snippet { font-family: var(--font-doc); font-size: 15px; color: var(--text); line-height: 1.7; }
.ai-summary-box { background: rgba(176,32,110,.04); border: 1px solid rgba(176,32,110,.2); border-radius: var(--radius-md); padding: 16px 20px; }
.ai-summary-content { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-wrap; }
.template-content-preview { white-space: pre-wrap; margin-block-start: 10px; max-height: 160px; overflow: auto; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-2); background: var(--inset); border-radius: var(--radius-sm); padding: 10px 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------
// Litigation Agent — Phase 1-4 scaffold, restyled to match the firm's
// approved design template (hoyaam design system: sidebar shell, dense
// tables, chip-confirmed/chip-provisional deadline states, split review

// ---------- small helpers ----------
function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}
function bdi(text) { return h('bdi', {}, String(text)); }
function icon(name, extraClass) { return h('span', { class: `nav-icon ${extraClass || ''}`, html: ICONS[name] || '' }); }
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('ar-EG') : '—'; }
function initials(name) { return (name || '').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('') || '؟'; }

async function callFunction(slug, body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${FUNCTIONS_URL}/${slug}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token ?? ''}` },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `${slug} failed (${res.status})`);
  return json;
}

let toastTimer = null;
function showToast(msg) {
  document.querySelectorAll('.app-toast').forEach((t) => t.remove());
  const toast = h('div', { class: 'app-toast' }, ['🔔 ', msg]);
  document.body.appendChild(toast);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.remove(), 3200);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('litigation-agent-theme', theme); } catch {}
}

async function loadViewer() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const [{ data: profile }, { data: roleRows }] = await Promise.all([
    sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle(),
    sb.from('user_roles').select('roles(label_en)').eq('user_id', user.id).is('revoked_at', null),
  ]);
  const roleLabel = (roleRows || []).map((r) => r.roles?.label_en).filter(Boolean).join(', ') || 'بدون دور';
  return { email: user.email || '', fullName: profile?.full_name || user.email || '', roleLabel };
}

    panel.appendChild(h('div', { class: 'table-wrapper' }, h('table', { class: 'dense-table' }, [

// ---------- document upload ----------
function openUploadDialog(matterId, onDone) {
  const overlay = h('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay && !busy) overlay.remove(); } }, []);
  document.body.appendChild(overlay);
  let file = null, error = null, stage = null, busy = false; // stage: null|'uploading'|'extracting'|'done'|'failed'

  function stepClass(idx, order) {
    const stages = [null, 'uploading', 'extracting', 'done'];
    const cur = stages.indexOf(stage);
    if (stage === 'failed') return order === 3 ? 'failed' : (order < cur ? 'completed' : '');
    if (order < cur) return 'completed';
    if (order === cur) return 'current';
    return '';
  }

  function paint() {
    clear(overlay);
    const stages = [null, 'uploading', 'extracting', 'done'];
    const cur = stages.indexOf(stage);
    overlay.appendChild(h('div', { class: 'modal-card' }, [
      h('h2', {}, 'رفع مستند'),
      error ? h('div', { class: 'form-error' }, error) : null,
      !stage ? h('div', { class: 'form-group' }, [
        h('label', { class: 'form-label' }, 'الملف (PDF أو صورة)'),
        h('input', { class: 'form-input', type: 'file', accept: 'application/pdf,image/*', onchange: (e) => { file = e.target.files[0] || null; } }),
      ]) : h('div', { class: 'file-stepper' }, [
        h('div', { class: `file-step ${cur > 0 ? 'completed' : cur === 0 ? 'current' : ''}` }, [h('div', { class: 'step-dot' }, cur > 0 ? '✓' : '١'), h('div', { class: 'step-name' }, 'رفع')]),
        h('div', { class: `file-step ${stage === 'failed' ? '' : cur > 1 ? 'completed' : cur === 1 ? 'current' : ''}` }, [h('div', { class: 'step-dot' }, cur > 1 ? '✓' : '٢'), h('div', { class: 'step-name' }, 'استخراج (Gemini)')]),
        h('div', { class: `file-step ${stage === 'failed' ? 'failed' : cur === 2 ? 'completed' : ''}` }, [h('div', { class: 'step-dot' }, stage === 'failed' ? '✕' : cur === 2 ? '✓' : '٣'), h('div', { class: 'step-name' }, stage === 'failed' ? 'فشل' : 'تم')]),
      ]),
      h('div', { class: 'page-header', style: 'margin:0' }, [
        h('button', { class: 'btn btn-outline', disabled: busy ? 'true' : null, onclick: () => overlay.remove() }, stage === 'done' ? 'إغلاق' : 'إلغاء'),
        !stage ? h('button', {
          class: 'btn btn-primary',
          onclick: async () => {
            error = null;
            if (!file) { error = 'اختر ملفاً أولاً'; paint(); return; }
            busy = true; stage = 'uploading'; paint();
            try {
              const ing = await callFunction('legal-ingest', { matter_id: matterId, original_filename: file.name, mime_type: file.type });
              const { error: upErr } = await sb.storage.from('matter-documents').uploadToSignedUrl(ing.storage_path, ing.token, file);
              if (upErr) throw upErr;
              stage = 'extracting'; paint();

async function renderReviewQueue(content) {

  ]));

  const container = h('div', {}, h('p', { class: 'empty-note' }, 'جارٍ التحميل…'));
  content.appendChild(container);

  const { data, error } = await sb
    .from('extractions')
    .select('id, matter_id, document_id, field_key, field_value, confidence, created_at, matters(matter_label)')
    .eq('review_status', 'pending')
    .order('document_id', { ascending: true })
    .order('created_at', { ascending: true });

  clear(container);
  if (error) { container.appendChild(h('div', { class: 'form-error' }, `تعذّر التحميل: ${error.message}`)); return; }
  if (!data || data.length === 0) { container.appendChild(h('p', { class: 'empty-note' }, 'لا يوجد شيء بانتظار المراجعة.')); return; }

  const byDoc = new Map();
  for (const ex of data) { if (!byDoc.has(ex.document_id)) byDoc.set(ex.document_id, []); byDoc.get(ex.document_id).push(ex); }
  const docIds = [...byDoc.keys()];
  let activeDocId = docIds[0];

  const split = h('div', { class: 'split-review-container' }, []);
  container.appendChild(split);

  async function paintSplit() {
    clear(split);
    const docExts = byDoc.get(activeDocId) || [];
    const { data: docRow } = await sb.from('documents').select('id, original_filename, matter_id, storage_path, mime_type').eq('id', activeDocId).maybeSingle();

    // Left: doc viewer pane
    const viewerPane = h('div', { class: 'doc-viewer-pane' }, [
      h('div', { class: 'doc-viewer-header' }, [
        h('span', {}, docRow?.original_filename || 'مستند'),
        docIds.length > 1 ? h('select', {
          class: 'form-select', style: 'width:auto; padding-block:4px',
          onchange: (e) => { activeDocId = e.target.value; paintSplit(); },
        }, docIds.map((id) => h('option', { value: id, selected: id === activeDocId ? 'true' : null }, (byDoc.get(id)[0].matters?.matter_label || id) + ` (${byDoc.get(id).length})`))) : null,
      ]),
      h('div', { class: 'doc-canvas-area' }, h('p', { style: 'color:#aaa; font-size:13px' }, 'جارٍ تحميل المعاينة…')),
    ]);
    split.appendChild(viewerPane);

    if (docRow) {
      const canvas = viewerPane.querySelector('.doc-canvas-area');
      clear(canvas);
      try {
        const signRes = await callFunction('sign-document-url', { matter_id: docRow.matter_id, bucket: 'matter-documents', storage_path: docRow.storage_path });
        if (String(docRow.mime_type || '').startsWith('image/')) canvas.appendChild(h('img', { src: signRes.url }));
        else canvas.appendChild(h('iframe', { src: signRes.url }));
      } catch (e) {
        canvas.appendChild(h('p', { style: 'color:#ddd; font-size:13px; padding:16px' }, 'تعذّر تحميل معاينة الملف.'));
      }
    }

    // Right: extractions pane
    const extPane = h('div', { class: 'extractions-pane' }, [
      h('div', { class: 'extractions-header' }, [
        h('strong', {}, 'الحقول المستخرجة'),
        h('span', { class: 'chip chip-stage' }, [bdi(docExts.length), ' حقول']),
      ]),
    ]);
    const list = h('div', { class: 'extractions-list' }, []);
    for (const ex of docExts) list.appendChild(renderReviewRow(ex, () => renderReviewQueue(content)));
    extPane.appendChild(list);
    split.appendChild(extPane);
  }
  await paintSplit();
}

function renderReviewRow(ex, onDone) {
  let corrected = ex.field_value || '', error = null, submitting = false;
  const row = h('div', { class: 'extraction-row' }, []);
  const confPct = Math.round((ex.confidence || 0) * 100);
  const confClass = confPct >= 85 ? 'confidence-high' : confPct >= 60 ? 'confidence-mid' : 'confidence-low';

  function paint() {
    clear(row);
    row.appendChild(h('div', { class: 'ext-top' }, [
      h('span', { class: 'ext-field-name' }, ex.field_key),
      h('span', { class: `confidence-chip ${confClass}` }, ['ثقة: ', bdi(confPct + '%')]),
    ]));
    row.appendChild(h('p', { class: 'form-hint' }, ex.matters ? ex.matters.matter_label : ex.matter_id));
    if (error) row.appendChild(h('div', { class: 'form-error' }, error));
    row.appendChild(h('input', { class: 'ext-value-input', value: corrected, oninput: (e) => (corrected = e.target.value) }));
    row.appendChild(h('div', { class: 'ext-actions-bar' }, [
      h('button', { class: 'btn btn-good btn-sm', disabled: submitting ? 'true' : null, onclick: () => act(corrected === ex.field_value ? 'confirm' : 'correct') }, corrected === ex.field_value ? '✓ قبول' : '✏️ تصحيح'),
      h('button', { class: 'btn btn-danger btn-sm', disabled: submitting ? 'true' : null, onclick: () => act('reject') }, '✕ رفض'),
    ]));
  }

  async function act(action) {
    error = null; submitting = true; paint();
    try {
      await callFunction('litigation-review-extraction', { extraction_id: ex.id, action, corrected_value: action === 'correct' ? corrected : undefined });
      onDone();
    } catch (e) { error = e.message; submitting = false; paint(); }
  }
  paint();
  return row;
}

// ---------- router ----------
function route() {
  const content = document.getElementById('content');
  if (!content) return;
  const hash = location.hash || '#/matters';
  const matterMatch = hash.match(/^#\/matters\/([0-9a-f-]+)/i);
  if (hash.startsWith('#/review')) renderReviewQueue(content);
  else if (hash.startsWith('#/search')) renderSearchPage(content);
  else if (hash.startsWith('#/templates')) renderTemplatesPage(content);
  else if (hash.startsWith('#/corpus')) renderCorpusPage(content);
  else if (hash.startsWith('#/research')) renderResearchPage(content);
  else if (matterMatch) renderMatterDetail(content, matterMatch[1]);
  else renderMattersList(content);
}
window.addEventListener('hashchange', async () => { await renderShell(location.hash); route(); });

// ---------- boot / auth gate ----------
async function boot() {
  try { applyTheme(localStorage.getItem('litigation-agent-theme') || 'light'); } catch {}

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }

  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') {
    const { data: factors } = await sb.auth.mfa.listFactors();
    const verified = (factors?.totp || []).find((f) => f.status === 'verified');
    if (verified) { renderMfaChallenge(verified.id); return; }
    clear(app);
    app.appendChild(h('div', { class: 'auth-screen' }, h('div', { class: 'auth-card' }, [
      h('div', { class: 'form-error' }, 'يتطلب هذا النظام التحقق بخطوتين (MFA) ولا يوجد جهاز مسجّل بعد.'),
      h('p', {}, 'سجّل جهاز المصادقة عبر لوحة الإدارة (back-office portal) أولاً، ثم عد لتسجيل الدخول هنا.'),
      h('button', { class: 'btn btn-outline', onclick: async () => { await sb.auth.signOut(); boot(); } }, 'خروج'),
    ])));
    return;
  }

  viewer = await loadViewer().catch(() => null);
  await renderShell(location.hash);
  route();
}

sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') renderLogin(); });

boot();
</script>
</body>
</html>
